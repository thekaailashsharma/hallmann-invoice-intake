<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hallmann · Invoices</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1c1c1e; --ink-2:#4b4b50; --muted:#8b8b90; --line:#e8e5dc; --line-2:#f0ede6; --bg:#eceae4; --panel:#f6f4ee; --card:#fff; --yellow:#f7d44c; --yellow-soft:#fbf1c0; --green:#2f8a4c; --green-soft:#e7f3ea; --red:#c43d2f; --red-soft:#fbe9e6; --blue:#2d6be5; --blue-soft:#e7eefc; --amber:#8a6a00; --r:22px; --r-s:12px; --s1:8px; --s2:16px; --s3:24px; --s4:32px }
  * { box-sizing:border-box } html, body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
  a { color:inherit; text-decoration:none } button, input, select { font:inherit } :focus-visible { outline:2px solid var(--ink); outline-offset:2px; border-radius:6px } svg.i { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none }
  .app { display:grid; grid-template-columns:232px 1fr; min-height:100vh }
  .side { background:var(--panel); border-right:1px solid var(--line); padding:var(--s3) var(--s2); display:flex; flex-direction:column; gap:var(--s4); position:sticky; top:0; height:100vh }
  .side .logo img { height:34px } .side nav { display:flex; flex-direction:column; gap:4px } .side nav a { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; color:var(--ink-2); font-weight:400 } .side nav a:hover { background:#fff } .side nav a.active { background:#fff; color:var(--ink); font-weight:500; box-shadow:0 1px 2px rgba(0,0,0,.05) } .side nav a b { margin-left:auto; font-weight:500; font-size:12px; background:var(--yellow-soft); color:var(--amber); padding:2px 8px; border-radius:999px }
  .side .erp { margin-top:auto; display:flex; align-items:center; gap:10px; padding:12px; border-radius:12px; background:#fff; font-size:13px; color:var(--ink-2) } .side .erp i { width:8px; height:8px; border-radius:50%; background:var(--green) } .side .erp.down { color:var(--red) } .side .erp.down i { background:var(--red) } .side .erp small { display:block; color:var(--muted) }
  .content { padding:var(--s3) var(--s4) 64px; max-width:1240px; width:100% }
  .bar { display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s3) } .bar h1 { font-size:28px; font-weight:400; margin:0; letter-spacing:-.3px } .bar h1 b { font-weight:500 } .bar .spacer { flex:1 }
  .user { position:relative } .user > button { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:6px 12px 6px 6px; cursor:pointer } .avatar { width:30px; height:30px; border-radius:50%; background:var(--ink); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-weight:500; font-size:13px }
  .menu { position:absolute; right:0; top:46px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:8px; min-width:240px; box-shadow:0 18px 50px rgba(0,0,0,.12); z-index:20; display:none } .menu.open { display:block } .menu .who { padding:10px 12px; border-bottom:1px solid var(--line); margin-bottom:6px } .menu .who small { display:block; color:var(--muted) } .menu button, .menu a { display:flex; width:100%; align-items:center; gap:10px; padding:9px 12px; border:0; background:none; border-radius:10px; cursor:pointer; text-align:left; color:var(--ink-2) } .menu button:hover, .menu a:hover { background:var(--panel) } .menu .danger { color:var(--red) }
  .stats { display:grid; grid-template-columns:repeat(4, 1fr) 2fr; gap:var(--s2); margin-bottom:var(--s3) } .tile { background:#fff; border-radius:var(--r); padding:18px 20px; display:flex; flex-direction:column; gap:4px; cursor:pointer; border:1px solid transparent } .tile:hover { border-color:var(--line) } .tile.active { border-color:var(--ink) } .tile .l { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:8px } .tile .n { font-size:30px; font-weight:300; line-height:1.1 } .tile .m { color:var(--muted); font-size:12.5px } .tile.spark { cursor:default } .tile.spark svg { width:100%; height:48px; margin-top:4px }
  .card { background:#fff; border-radius:var(--r); padding:var(--s3) } .card h2 { margin:0 0 var(--s2); font-size:15px; font-weight:500; display:flex; align-items:center; gap:10px; color:var(--ink) } .card h2 .sub { color:var(--muted); font-weight:400; font-size:13px }
  .chips { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:var(--s2) } .chip { padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink-2); cursor:pointer; font-size:13.5px } .chip.active { background:var(--ink); color:#fff; border-color:var(--ink) } .chips .grow { flex:1 }
  .search { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; padding:0 12px; background:#fff; min-width:280px } .search input { border:0; outline:0; padding:9px 0; width:100%; background:transparent } .chips input[type=date] { border:1px solid var(--line); border-radius:999px; padding:7px 12px; background:#fff; color:var(--ink-2) }
  table { width:100%; border-collapse:separate; border-spacing:0 } th { text-align:left; font-size:12px; color:var(--muted); font-weight:500; padding:0 12px 12px; cursor:pointer; user-select:none; white-space:nowrap } th.num { text-align:right } td { padding:14px 12px; border-top:1px solid var(--line-2); vertical-align:middle }
  tr.row { cursor:pointer } tr.row:hover td { background:#faf9f5 } tr.row td:first-child { border-left:3px solid transparent; border-radius:8px 0 0 8px } tr.row.needs_review td:first-child { border-left-color:var(--yellow) } tr.row.pending_erp td:first-child { border-left-color:var(--blue) } tr.row.booked td:first-child { border-left-color:var(--green) } tr.row.rejected td:first-child, tr.row.duplicate td:first-child { border-left-color:var(--red) }
  td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:500 } .dim { color:var(--muted); font-size:13px; font-weight:400 } .sup { font-weight:500 } .sup + .dim { margin-top:2px }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:500; background:#efede6; color:var(--ink-2); white-space:nowrap } .pill svg.i { width:13px; height:13px }
  .pill.needs_review { background:var(--yellow-soft); color:var(--amber) } .pill.booked { background:var(--green-soft); color:var(--green) } .pill.pending_erp { background:var(--blue-soft); color:var(--blue) } .pill.rejected, .pill.duplicate { background:var(--red-soft); color:var(--red) } .pill.ignored { color:var(--muted) }
  .why { color:var(--ink-2); font-size:13.5px; max-width:460px } .why .flag { color:var(--red); font-weight:500; display:flex; gap:6px; align-items:center } .why .w { color:var(--muted); font-size:12.5px }
  .empty { padding:56px; text-align:center; color:var(--muted) } .empty svg.i { width:28px; height:28px; margin-bottom:8px; color:var(--line) } .skeleton td div { height:14px; background:var(--line-2); border-radius:6px; animation:sh 1.2s infinite } @keyframes sh { 50% { opacity:.5 } }
  .pager { display:flex; justify-content:space-between; align-items:center; margin-top:var(--s2); color:var(--muted); font-size:13px } .pager button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 14px; cursor:pointer } .pager button:disabled { opacity:.4; cursor:default }
  .back { display:inline-flex; align-items:center; gap:6px; color:var(--ink-2); font-size:14px; margin-bottom:var(--s2) } .back:hover { color:var(--ink) }
  .head { display:flex; align-items:flex-start; gap:var(--s3); margin-bottom:var(--s3) } .head .amt { margin-left:auto; text-align:right } .head .amt .n { font-size:34px; font-weight:300; line-height:1 } .head .amt .l { color:var(--muted); font-size:13px; margin-top:4px } .head .meta { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin-top:6px } .head .meta span { display:inline-flex; align-items:center; gap:6px }
  .split { display:grid; grid-template-columns:1fr 1fr; gap:var(--s2); align-items:start } @media (max-width:1100px) { .split, .stats { grid-template-columns:1fr } .app { grid-template-columns:72px 1fr } .side nav a span, .side .logo img { display:none } .side .erp small, .side .erp span { display:none } }
  pre.mail { white-space:pre-wrap; font:13.5px/1.6 "Outfit", sans-serif; color:var(--ink-2); margin:0; max-height:70vh; overflow:auto }
  .breakdown { margin:0 0 var(--s2) } .breakdown .bar2 { display:flex; height:10px; border-radius:6px; overflow:hidden; gap:2px; background:var(--line-2) } .breakdown .bar2 i { display:block; height:100% } .breakdown .lg { display:flex; gap:18px; margin-top:8px; font-size:13px; color:var(--ink-2) } .breakdown .lg b { font-weight:500 } .breakdown .lg i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px }
  .field { display:grid; grid-template-columns:140px 1fr; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line-2) } .field:first-of-type { border-top:0 } .field label { color:var(--muted); font-size:13px }
  .field input, .field select { padding:8px 10px; border:1px solid transparent; border-radius:10px; background:var(--panel); width:100%; color:var(--ink) } .field input:focus, .field select:focus { outline:0; border-color:var(--ink); background:#fff } .field input:disabled, .field select:disabled { background:transparent; color:var(--ink) } .field.bad input { border-color:var(--red); background:var(--red-soft) }
  .items { width:100%; font-size:13px; margin-top:6px } .items td { padding:6px 8px; border-top:1px solid var(--line-2) }
  .check { margin-top:var(--s2); padding:14px 16px; border-radius:var(--r-s); background:var(--ink); color:#fff; font-size:14px; line-height:1.55; display:flex; gap:12px; align-items:flex-start } .check.ok { background:var(--green) } .check.warn { background:var(--amber) } .check small { opacity:.8 } .check svg.i { margin-top:2px }
  .actions { display:flex; gap:10px; margin-top:var(--s2); flex-wrap:wrap; align-items:center } .btn { display:inline-flex; align-items:center; gap:8px; font-weight:500; padding:10px 16px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer } .btn.primary { background:var(--yellow); border-color:var(--yellow) } .btn.quiet { color:var(--red) } .btn.dark { background:var(--ink); color:#fff; border-color:var(--ink) } .btn.ghost { border-color:transparent; color:var(--ink-2) } .btn:disabled { opacity:.4; cursor:not-allowed }
  .inline { margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap } .inline input { flex:1; min-width:220px; padding:9px 12px; border:1px solid var(--line); border-radius:10px }
  .timeline { list-style:none; margin:0; padding:0 0 0 14px; border-left:2px solid var(--line-2) } .timeline li { position:relative; padding:0 0 14px 18px; font-size:14px } .timeline li::before { content:""; position:absolute; left:-20px; top:6px; width:10px; height:10px; border-radius:50%; background:#fff; border:2px solid var(--muted) } .timeline li.user::before { border-color:var(--yellow); background:var(--yellow) } .timeline time { color:var(--muted); font-size:12.5px; display:block } .timeline b { font-weight:500 } .timeline .note { color:var(--ink-2); font-size:13.5px }
  .alerts { position:fixed; right:24px; bottom:24px; display:flex; flex-direction:column; gap:10px; width:360px; z-index:9 } .alert { background:var(--ink); color:#fff; border-radius:16px; padding:14px 16px; font-size:13.5px; display:flex; gap:12px; align-items:flex-start; box-shadow:0 14px 40px rgba(0,0,0,.18) } .alert.critical { background:var(--red) } .alert.warning { background:var(--amber) } .alert button { margin-left:auto; border:1px solid rgba(255,255,255,.4); background:transparent; color:#fff; border-radius:999px; padding:4px 10px; cursor:pointer; font-size:12px }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:14px; z-index:10; opacity:0; transition:opacity .25s; pointer-events:none } .toast.show { opacity:1 } .toast.bad { background:var(--red) }
  .banner { background:var(--red-soft); color:var(--red); padding:12px 16px; border-radius:var(--r-s); margin-bottom:var(--s2); font-size:14px }
  .login { min-height:100vh; display:grid; place-items:center; background:var(--bg) } .login .box { width:420px; background:#fff; border-radius:28px; padding:36px } .login h1 { font-weight:300; font-size:30px; margin:18px 0 22px } .login .err { color:var(--red); font-size:13.5px; margin-top:12px; min-height:20px } .login .foot { display:flex; justify-content:space-between; margin-top:18px; color:var(--muted); font-size:13px } .login .foot a { cursor:pointer; color:var(--ink-2) }
  .grid2 { display:grid; grid-template-columns:1fr 1.4fr; gap:var(--s2) } .userrow { display:grid; grid-template-columns:1.4fr 1fr auto auto; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line-2); font-size:14px } .userrow:first-child { border-top:0 } .userrow select { border:1px solid var(--line); border-radius:999px; padding:6px 10px; background:#fff }
</style>
</head>
<body>
<div id="root"><div class="empty">…</div></div>
<div id="alerts" class="alerts"></div>
<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
