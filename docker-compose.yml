services:
  postgres:
    image: postgres:16-alpine
    container_name: intake-postgres
    environment:
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intake}
      POSTGRES_DB: intake
    ports: ["5433:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake -d intake"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailbox:
    # Stand-in for Hallmann's invoice mailbox (IMAP 3143, SMTP 3025). Production: the real M365/IMAP mailbox.
    image: greenmail/standalone:2.1.3
    container_name: intake-mailbox
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=rechnungen:${MAILBOX_PASSWORD:-mailbox}@hallmann.example -Dgreenmail.users.login=email -Dgreenmail.verbose
    ports: ["3025:3025", "3143:3143"]
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.45.5
    container_name: intake-n8n
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["5681:5678"]
    environment:
      - WEBHOOK_URL=http://localhost:5681/
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me-please}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=10
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=720
      - EXECUTIONS_TIMEOUT=300
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
      - SARVAM_API_KEY=${SARVAM_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./fixtures:/data:ro
      - ./n8n-assets:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/hallmann:ro
    restart: unless-stopped

  erp:
    # Mock ERP booking API (stands in for Hallmann's ERP). Production: n8n points at the real ERP URL instead.
    build: ./erp-mock
    container_name: intake-erp
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4000:4000"]
    environment:
      - DATABASE_URL=postgres://intake:${POSTGRES_PASSWORD:-intake}@postgres:5432/intake
      - ERP_API_KEY=${ERP_API_KEY}
    restart: unless-stopped

  review:
    build: ./app
    container_name: intake-review
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["3001:3001"]
    environment:
      - DATABASE_URL=postgres://intake:${POSTGRES_PASSWORD:-intake}@postgres:5432/intake
      - N8N_WEBHOOK_BASE=${N8N_WEBHOOK_BASE:-http://n8n:5678/webhook}
      - N8N_WEBHOOK_KEY=${N8N_WEBHOOK_KEY}
      - PORT=3001
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
      - FIREBASE_REFRESH_TOKEN_FILE=/secrets/firebase-refresh.json
      - FIREBASE_SERVICE_ACCOUNT_FILE=/secrets/firebase-service-account.json
      - DEMO_MODE=${DEMO_MODE:-false}
      - CLERK_APPROVAL_LIMIT=${CLERK_APPROVAL_LIMIT:-10000}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS}
    volumes:
      - ./secrets:/secrets:ro
    restart: unless-stopped

volumes:
  pg_data:
  n8n_data:
